name: clue_map
description: "A fast, zero-lag Flutter plugin for clue maps featuring custom pin icons, theme presets, and automated city boundary overlays."
version: 0.0.1
homepage: https://github.com/yourusername/clue_map

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  google_maps_flutter: ^2.10.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.googlemap.com.googlemaparea
        pluginClass: GooglemapareaPlugin
      ios:
        pluginClass: GooglemapareaPlugin
      linux:
        pluginClass: GooglemapareaPlugin
      macos:
        pluginClass: GooglemapareaPlugin
      windows:
        pluginClass: GooglemapareaPluginCApi
      web:
        pluginClass: ClueMapWeb
        fileName: clue_map_web.dart
