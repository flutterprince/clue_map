name: clue_map
description: >-
  A Flutter map plugin providing ClueMapCard with custom markers, theme
  presets (minimalist, dark, retro), and automated reverse-geocoded city boundaries.
version: 0.0.2
homepage: https://github.com/flutterprince/clue_map
repository: https://github.com/flutterprince/clue_map
issue_tracker: https://github.com/flutterprince/clue_map/issues

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  google_maps_flutter: ^2.10.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.clue_map.clue_map
        pluginClass: ClueMapPlugin
      ios:
        pluginClass: ClueMapPlugin
      web:
        pluginClass: ClueMapWeb
        fileName: clue_map_web.dart
